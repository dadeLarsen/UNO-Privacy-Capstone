task = "classification"
strategy = "embedding-similarity"
warmup = 1

[items]
dataset = "appsi139-sentences"
sample = "appsi139-balanced-50"
gold = "appsi139-astra"

[model]
id = "google/embeddinggemma-2"
revision = "914f7f89142e33e77833254d9c9b90c3cef7303b"
precision = "bf16"
device = "cuda"
text_only = true

# Search mode: each category description is a search query, and the sentences are the documents.
[options]
prompt = "definitions"
sentence_prefix = "title: none | text: "
category_prefix = "task: search result | query: "
max_input_tokens = 8192
