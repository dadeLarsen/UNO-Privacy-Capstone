[project]
name = "privacy-bench"
version = "0.1.0"
description = "Model benchmarks for an offline privacy-policy reader."
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub==1.33.0",
    "jinja2==3.1.6",
    "llama-cpp-python==0.3.37",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pyphen==0.18.1",
    "safetensors==0.8.0",
]

[project.scripts]
pbench = "privacy_bench.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]
# Which llama.cpp build to install; see Setup in README.md. The CUDA build needs NVIDIA's cuBLAS, and on Linux
# its CUDA runtime, and ships neither. privacy_bench.models loads them before llama_cpp.
cu132 = [
    "llama-cpp-python==0.3.37",
    "nvidia-cublas==13.4.1.3; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "nvidia-cuda-runtime==13.2.86; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Empty: it is the choice against cu132, and with it llama-cpp-python builds from source.
cpu = []

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_bench"]

[tool.uv]
default-groups = ["dev", "cu132"]
conflicts = [[{ group = "cu132" }, { group = "cpu" }]]
# Transitive packages stay pinned, so a library change is always a deliberate edit here.
# Each run records the full package list it ran with.
constraint-dependencies = [
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "click==8.5.0",
    "colorama==0.4.6",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "diskcache==5.6.3",
    "filelock==3.32.3",
    "fonttools==4.65.0",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "kiwisolver==1.5.1",
    "markupsafe==3.0.3",
    "nvidia-cuda-nvrtc==13.2.86",
    "packaging==26.3",
    "pillow==12.3.0",
    "pygments==2.21.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "six==1.17.0",
    "tqdm==4.70.1",
    "typing-extensions==4.16.0",
]

[tool.uv.sources]
# PyPI has only the source of llama-cpp-python. With the cu132 group, Windows and Linux on x64 take the
# project's built CUDA 13.2 wheel by its URL, so that uv.lock records its hash. That wheel computes on the
# GPU or on the CPU. Everything else builds from source: the cpu group, because 0.3.37 has no built CPU
# wheel, and every other platform. A Mac's build includes llama.cpp's Metal GPU backend.
llama-cpp-python = [
    { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-cu132/llama_cpp_python-0.3.37-py3-none-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'", group = "cu132" },
    { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-cu132/llama_cpp_python-0.3.37-py3-none-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'", group = "cu132" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra", "-m", "not gpu"]
markers = ["gpu: needs CUDA and cached model weights; run with `-m gpu`"]
