[project]
name = "privacy-bench"
version = "0.1.0"
description = "Model benchmarks for an offline privacy-policy reader."
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "huggingface-hub==1.33.0",
    "jinja2==3.1.6",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "peft==0.21.0",
    "safetensors==0.8.0",
    "scikit-learn==1.9.1",
    "sentence-transformers==6.1.0",
    "tokenizers==0.23.2",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.19.0",
]

[project.scripts]
pbench = "privacy_bench.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]
# Which torch build to install; see Setup in README.md.
cu128 = ["torch==2.8.0", "torchvision==0.23.0"]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/privacy_bench"]

[tool.uv]
default-groups = ["dev", "cu128"]
conflicts = [[{ group = "cu128" }, { group = "cpu" }]]
# Transitive packages stay pinned, so a library change is always a deliberate edit here.
# Each run records the full package list it ran with.
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "cloudpickle==3.1.2",
    "colorama==0.4.6",
    "contourpy==1.4.0",
    "cycler==0.12.1",
    "filelock==3.32.3",
    "fonttools==4.65.0",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "joblib==1.6.0",
    "kiwisolver==1.5.1",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "narwhals==2.27.1",
    "networkx==3.6.1",
    "packaging==26.3",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pygments==2.21.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.9.10",
    "requests==2.34.2",
    "rich==15.0.0",
    "scipy==1.18.1",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy==1.14.0",
    "threadpoolctl==3.7.0",
    "tqdm==4.70.1",
    "typer==0.27.2",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", group = "cu128" }, { index = "pytorch-cpu", group = "cpu" }]
torchvision = [{ index = "pytorch-cu128", group = "cu128" }, { index = "pytorch-cpu", group = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra", "-m", "not gpu"]
markers = ["gpu: needs CUDA and cached model weights; run with `-m gpu`"]
