task = "classification"
title = "APPSI-139: up to 50 sentences per category, with the tuned balanced head on the CPU"
# Accepted labels are the original mapped labels plus every label ChatGPT Astra marked.
# Both EmbeddingGemma 2 runs use the same shifted head, fitted on BF16 embeddings: one in BF16 on the GPU,
# one in FP32 on the CPU. The head tuned on APPSI-139's tuning half, which holds 272 of these 460 sentences.
runs = [
    "classification/privacy-model-fp32-appsi139-balanced-50/20261012-014228Z",
    "classification/embeddinggemma2-bf16-head-linear-balanced-tuned-appsi139-balanced-50/20261012-050536Z",
    "classification/embeddinggemma2-fp32-cpu-head-linear-balanced-tuned-appsi139-balanced-50/20261112-185743Z",
]

[scoring]
gold = "appsi139-astra"

[labels]
"classification/privacy-model-fp32-appsi139-balanced-50/20261012-014228Z" = "skythrone/privacy-model · FP32 on the GPU"
"classification/embeddinggemma2-bf16-head-linear-balanced-tuned-appsi139-balanced-50/20261012-050536Z" = "google/embeddinggemma-2 · BF16 on the GPU"
"classification/embeddinggemma2-fp32-cpu-head-linear-balanced-tuned-appsi139-balanced-50/20261112-185743Z" = "google/embeddinggemma-2 · FP32 on the CPU"
