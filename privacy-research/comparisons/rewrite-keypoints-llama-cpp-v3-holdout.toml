    "rewrite/qwen3.5-4b-nf4-summary-v3-holdout/20261118-225545Z",       # bitsandbytes, repeated on torch 2.15.0
    "rewrite/qwen3.5-4b-q4km-cpu-summary-v3-holdout/20261118-215438Z",  # llama.cpp on the desktop's CPU
    "rewrite/qwen3.5-4b-q4km-gpu-summary-v3-holdout/20261119-135612Z",  # llama.cpp on the desktop's GPU
    "rewrite/qwen3.5-4b-q4km-cpu-summary-v3-holdout/20261119-140917Z",  # llama.cpp on an M4 Pro MacBook's CPU
    "rewrite/qwen3.5-4b-q4km-gpu-summary-v3-holdout/20261119-141347Z",  # llama.cpp on the MacBook's GPU
]
