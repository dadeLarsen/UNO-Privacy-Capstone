<rect x="309" y="472" width="714" height="52" rx="4" fill="none" stroke="#2f5fb3" stroke-width="2" />
<text x="316" y="492" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We may retain account records for up to 30 days after you delete your account, except where a</text>
<text x="316" y="513" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">longer period is required by law.</text>
