<text x="316" y="141" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">At BrightCart™, your privacy is important to us.</text>
<rect x="1040" y="126" width="54" height="20" rx="10" fill="#d7b49e" stroke="none" stroke-width="1.2" fill-opacity="0.85"/>
<text x="1067.0" y="140" font-size="11.5" fill="#1d1d1d" font-weight="600" text-anchor="middle" font-style="normal">Other</text>
<rect x="310" y="157" width="712" height="71" rx="4" fill="#f4a582" stroke="none" stroke-width="1.2" fill-opacity="0.32"/>
<text x="316" y="176" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">When you sign up, place an order, or contact our support team, we collect personal information</text>
<text x="316" y="197" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">such as your name, email address, shipping details, and payment method to process your requests</text>
<text x="316" y="218" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">and improve your shopping experience.</text>
<rect x="1040" y="161" width="92" height="20" rx="10" fill="#f4a582" stroke="none" stroke-width="1.2" fill-opacity="0.85"/>
<text x="1086.0" y="175" font-size="11.5" fill="#1d1d1d" font-weight="600" text-anchor="middle" font-style="normal">First Party</text>
<rect x="310" y="246" width="712" height="50" rx="4" fill="#8cc265" stroke="none" stroke-width="1.2" fill-opacity="0.32"/>
<text x="316" y="265" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We may share certain information, such as your email address, with trusted third-party marketing</text>
<text x="316" y="286" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">partners who assist us in delivering personalized promotions.</text>
<rect x="1040" y="250" width="92" height="20" rx="10" fill="#8cc265" stroke="none" stroke-width="1.2" fill-opacity="0.85"/>
<text x="1086.0" y="264" font-size="11.5" fill="#1d1d1d" font-weight="600" text-anchor="middle" font-style="normal">Third Party</text>
<rect x="310" y="302" width="712" height="50" rx="4" fill="#8cc265" stroke="none" stroke-width="1.2" fill-opacity="0.32"/>
<text x="316" y="321" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">These partners are required to maintain confidentiality and are not permitted to use your data</text>
<text x="316" y="342" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">for other purposes.</text>
<rect x="1040" y="306" width="92" height="20" rx="10" fill="#8cc265" stroke="none" stroke-width="1.2" fill-opacity="0.85"/>
<text x="1086.0" y="320" font-size="11.5" fill="#1d1d1d" font-weight="600" text-anchor="middle" font-style="normal">Third Party</text>
<rect x="310" y="370" width="712" height="29" rx="4" fill="#6ea8fe" stroke="none" stroke-width="1.2" fill-opacity="0.32"/>
<text x="316" y="389" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">You have the ability to manage your communication preferences at any time.</text>
<rect x="1040" y="374" width="92" height="20" rx="10" fill="#6ea8fe" stroke="none" stroke-width="1.2" fill-opacity="0.85"/>
<text x="1086.0" y="388" font-size="11.5" fill="#1d1d1d" font-weight="600" text-anchor="middle" font-style="normal">User Choice</text>
<rect x="310" y="405" width="712" height="50" rx="4" fill="#6ea8fe" stroke="none" stroke-width="1.2" fill-opacity="0.32"/>
<text x="316" y="424" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">To stop receiving promotional emails, simply click the “unsubscribe” link in any message or</text>
<text x="316" y="445" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">update your preferences in your account settings.</text>
<rect x="1040" y="409" width="92" height="20" rx="10" fill="#6ea8fe" stroke="none" stroke-width="1.2" fill-opacity="0.85"/>
