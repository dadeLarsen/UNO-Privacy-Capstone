<text x="316" y="144" font-size="12" fill="#777" font-weight="600" text-anchor="start" font-style="normal">Policy text</text>
<text x="322" y="171" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">At BrightCart™, your privacy is important to us.</text>
<text x="322" y="206" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">When you sign up, place an order, or contact our support team, we collect personal information such as your name,</text>
<text x="322" y="227" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">email address, shipping details, and payment method to process your requests and improve your shopping experience.</text>
<text x="322" y="274" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We may share certain information, such as your email address, with trusted third-party marketing partners who assist</text>
<text x="322" y="295" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">us in delivering personalized promotions.</text>
<text x="322" y="330" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">These partners are required to maintain confidentiality and are not permitted to use your data for other purposes.</text>
<text x="322" y="377" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">You have the ability to manage your communication preferences at any time.</text>
<text x="322" y="412" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">To stop receiving promotional emails, simply click the “unsubscribe” link in any message or update your preferences in</text>
<text x="322" y="433" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">your account settings.</text>
<text x="322" y="480" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We may retain account records for up to 30 days after you delete your account, except where a longer period is</text>
<text x="322" y="501" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">required by law.</text>
<text x="322" y="548" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We use industry-standard encryption to protect your payment information.</text>
