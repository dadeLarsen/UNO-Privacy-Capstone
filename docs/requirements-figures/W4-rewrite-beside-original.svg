<rect x="640" y="116" width="145" height="28" rx="5" fill="#fff" stroke="#666" stroke-width="1.2" />
<text x="712.5" y="135" font-size="12.5" fill="#222" font-weight="700" text-anchor="middle" font-style="normal">Simplify for Kids</text>
<rect x="791" y="116" width="96" height="28" rx="5" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" />
<text x="839.0" y="135" font-size="12.5" fill="#999" font-weight="400" text-anchor="middle" font-style="normal">Paraphrase</text>
<rect x="893" y="116" width="159" height="28" rx="5" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" />
<text x="972.5" y="135" font-size="12.5" fill="#999" font-weight="400" text-anchor="middle" font-style="normal">Simplify for Adults</text>
<rect x="640" y="164" width="528" height="107" rx="6" fill="#f7f9fd" stroke="#c9d6ee" stroke-width="1.2" />
<text x="656" y="188" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">You can choose which emails BrightCart sends you. To stop getting</text>
<text x="656" y="209" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">ads by email, click “unsubscribe” in any of those emails, or change</text>
<text x="656" y="230" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">your choices in your account settings.</text>
<text x="656" y="259" font-size="12.5" fill="#2f5fb3" font-weight="600" text-anchor="start" font-style="normal">↩ Source: sentences 5–6</text>
<rect x="640" y="283" width="528" height="107" rx="6" fill="#f7f9fd" stroke="#c9d6ee" stroke-width="1.2" />
<text x="656" y="307" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">After you delete your account, BrightCart may keep records about it</text>
<text x="656" y="328" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">for up to 30 days. If a law says they have to, they may keep them</text>
<text x="656" y="349" font-size="14" fill="#222" font-weight="400" text-anchor="start" font-style="normal">longer.</text>
<text x="656" y="378" font-size="12.5" fill="#2f5fb3" font-weight="600" text-anchor="start" font-style="normal">↩ Source: sentence 7</text>
<text x="640" y="416" font-size="12.5" fill="#2e5d1e" font-weight="400" text-anchor="start" font-style="normal">✓ Numbers, time limits, and exceptions match the source.</text>
