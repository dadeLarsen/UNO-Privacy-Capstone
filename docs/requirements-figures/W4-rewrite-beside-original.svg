<text x="602.0" y="85" font-size="13.5" fill="#222" font-weight="600" text-anchor="middle" font-style="normal">Simplify for Adults</text>
<text x="1180" y="85" font-size="12.5" fill="#444" font-weight="400" text-anchor="end" font-style="normal">Applies to: selection (sentences 5–7)</text>
<line x1="44" y1="108" x2="1200" y2="108" stroke="#ccc"/>
<text x="64" y="134" font-size="14" fill="#222" font-weight="700" text-anchor="start" font-style="normal">Original</text>
<text x="600" y="134" font-size="12" fill="#777" font-weight="400" text-anchor="end" font-style="normal">Highlight Categories: on</text>
<rect x="56" y="144" width="552" height="608" rx="6" fill="#fff" stroke="#666" stroke-width="1.3" />
<rect x="70" y="154" width="5" height="23" rx="2" fill="#d7b49e" stroke="none" stroke-width="1.2" />
<text x="80" y="171" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">At BrightCart™, your privacy is important to us.</text>
<rect x="70" y="187" width="5" height="80" rx="2" fill="#f4a582" stroke="none" stroke-width="1.2" />
<text x="80" y="204" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">When you sign up, place an order, or contact our support team, we collect</text>
<text x="80" y="223" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">personal information such as your name, email address, shipping details, and</text>
<text x="80" y="242" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">payment method to process your requests and improve your shopping</text>
<text x="80" y="261" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">experience.</text>
<rect x="70" y="289" width="5" height="61" rx="2" fill="#8cc265" stroke="none" stroke-width="1.2" />
<text x="80" y="306" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We may share certain information, such as your email address, with trusted</text>
<text x="80" y="325" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">third-party marketing partners who assist us in delivering personalized</text>
<text x="80" y="344" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">promotions.</text>
<rect x="70" y="360" width="5" height="42" rx="2" fill="#8cc265" stroke="none" stroke-width="1.2" />
<text x="80" y="377" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">These partners are required to maintain confidentiality and are not</text>
<text x="80" y="396" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">permitted to use your data for other purposes.</text>
<rect x="70" y="424" width="5" height="23" rx="2" fill="#6ea8fe" stroke="none" stroke-width="1.2" />
<rect x="73" y="421" width="524" height="29" rx="4" fill="none" stroke="#2f5fb3" stroke-width="2" />
<text x="80" y="441" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">You have the ability to manage your communication preferences at any time.</text>
<rect x="70" y="457" width="5" height="42" rx="2" fill="#6ea8fe" stroke="none" stroke-width="1.2" />
<rect x="73" y="454" width="524" height="48" rx="4" fill="none" stroke="#2f5fb3" stroke-width="2" />
<text x="80" y="474" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">To stop receiving promotional emails, simply click the “unsubscribe” link in</text>
<text x="80" y="493" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">any message or update your preferences in your account settings.</text>
<rect x="70" y="521" width="5" height="42" rx="2" fill="#ffb74d" stroke="none" stroke-width="1.2" />
<rect x="73" y="518" width="524" height="48" rx="4" fill="none" stroke="#2f5fb3" stroke-width="2" />
<text x="80" y="538" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We may retain account records for up to 30 days after you delete your</text>
<text x="80" y="557" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">account, except where a longer period is required by law.</text>
<rect x="70" y="585" width="5" height="23" rx="2" fill="#4db6ac" stroke="none" stroke-width="1.2" />
<text x="80" y="602" font-size="13" fill="#222" font-weight="400" text-anchor="start" font-style="normal">We use industry-standard encryption to protect your payment information.</text>
<rect x="80" y="630" width="510" height="9" rx="4" fill="#d4d4d4" stroke="none" stroke-width="1.2" />
<rect x="80" y="651" width="510" height="9" rx="4" fill="#d4d4d4" stroke="none" stroke-width="1.2" />
<rect x="80" y="672" width="306.0" height="9" rx="4" fill="#d4d4d4" stroke="none" stroke-width="1.2" />
