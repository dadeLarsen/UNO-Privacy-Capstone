[project]
name = "model-service"
version = "0.1.0"
description = "Localhost-only model service for the Privacy Policy Reader."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.5",
    "privacy-bench",
    "python-multipart==0.0.33",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
model-service = "model_service.__main__:main"

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]
cu132 = ["torch==2.15.0", "torchvision==0.29.2", "llama-cpp-python==0.3.37"]
cpu = ["torch==2.15.0", "torchvision==0.29.2"]

[tool.uv]
default-groups = ["dev", "cu132"]
conflicts = [[{ group = "cu132" }, { group = "cpu" }]]

[tool.uv.sources]
# Reuse the benchmark's pinned model backends, strategies, and fitted heads.
privacy-bench = { path = "../privacy-research", editable = true }
torch = [{ index = "pytorch-cu132", group = "cu132" }, { index = "pytorch-cpu", group = "cpu" }]
torchvision = [{ index = "pytorch-cu132", group = "cu132" }, { index = "pytorch-cpu", group = "cpu" }]
# The same llama.cpp builds as ../privacy-research/pyproject.toml, which explains them.
llama-cpp-python = [
    { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-cu132/llama_cpp_python-0.3.37-py3-none-win_amd64.whl", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'", group = "cu132" },
    { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.37-cu132/llama_cpp_python-0.3.37-py3-none-manylinux_2_35_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'", group = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
