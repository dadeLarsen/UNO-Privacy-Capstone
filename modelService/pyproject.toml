[project]
name = "model-service"
version = "0.1.0"
description = "Localhost-only model service for the Privacy Policy Reader."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.5",
    "privacy-bench",
    "python-multipart==0.0.33",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
model-service = "model_service.__main__:main"

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]
cu128 = ["torch==2.8.0", "torchvision==0.23.0"]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]

[tool.uv]
default-groups = ["dev", "cu128"]
conflicts = [[{ group = "cu128" }, { group = "cpu" }]]

[tool.uv.sources]
# Reuse the benchmark's pinned model backends, strategies, and fitted heads.
privacy-bench = { path = "../privacy-research", editable = true }
torch = [{ index = "pytorch-cu128", group = "cu128" }, { index = "pytorch-cpu", group = "cpu" }]
torchvision = [{ index = "pytorch-cu128", group = "cu128" }, { index = "pytorch-cpu", group = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
