[project]
name = "privacy-policy-api"
version = "0.0.0"
description = "Frontend-facing API for the Privacy Policy Reader."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "python-multipart==0.0.33",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
privacy-policy-api = "api_service.__main__:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers", "--import-mode=importlib", "-ra"]
